name: Repair frontend dependency audit
on:
  push:
    paths:
      - '.github/workflows/repair-dependency-audit.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/atomic-running-binary-overlay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit
      - run: npm audit fix
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Commit verified dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: update audited frontend transitive dependencies'
            git push origin HEAD:fix/atomic-running-binary-overlay
          fi
