name: DigiOps CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:csp
      - run: node tools/check-pretty-routes.mjs
      - run: npm run build
      - run: php tools/package-release.php
      - run: php tools/check-release-package.php
      - uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
          include-hidden-files: true

  artifact-certification:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: digiops-release
          path: verified-release
      - name: Verify uploaded artifact
        run: |
          test -f verified-release/public/index.html
          test -f verified-release/public/.htaccess
          test -f verified-release/public/api/session.php
          test -f verified-release/private/app/php/bootstrap.php
          test -f verified-release/private/build/release.json
          grep -F "RewriteBase /digiops/" verified-release/public/.htaccess
          grep -F "RewriteRule ^api/ - [L]" verified-release/public/.htaccess
          grep -F "RewriteRule ^ index.html [L]" verified-release/public/.htaccess
          grep -E 'src="/digiops/assets/|href="/digiops/' verified-release/public/index.html
          echo "Uploaded artifact certification: PASS"

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, zip, sodium
      - name: PHP lint
        run: find app public tools agent -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Path guard tests
        run: php tests/php/PathGuardTest.php
      - name: Deployment candidate resolver tests
        run: php tests/php/DeploymentCandidateResolverTest.php

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obvious secrets and datasets
        run: |
          if find . -path './.git' -prune -o -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.csv' -o -name '*.xlsx' \) -print | grep -q .; then
            echo "Secret/data-like file found in repository"
            exit 1
          fi
