name: DigiOps CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:csp
      - run: npm run build
      - run: php tools/package-release.php
      - uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, zip, sodium
      - name: PHP lint
        run: find app public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Path guard tests
        run: php tests/php/PathGuardTest.php

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obvious secrets and datasets
        run: |
          if find . -path './.git' -prune -o -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.csv' -o -name '*.xlsx' \) -print | grep -q .; then
            echo "Secret/data-like file found in repository"
            exit 1
          fi
